name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v3.7.30)"
        required: true
        default: "v3.7.30"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PLUGIN_VERSION=$(node -p "require('./plugin/package.json').version")
          BACKEND_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("backend/FireFly/pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "backend_version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release workflow is present
        run: |
          test -f .github/workflows/release.yml
          test -f release/pack-llm-wiki-template.sh
          test -f INSTALL.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build backend wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build backend/FireFly
          ls -la backend/FireFly/dist/

      - name: Pack llm-wiki template
        run: bash release/pack-llm-wiki-template.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Build Zotero plugin (XPI)
        working-directory: plugin
        run: |
          npm ci
          npm run build
          ls -la .scaffold/build/
          test -f .scaffold/build/fire-fly-agent-zotero.xpi

      - name: Stage release assets
        run: |
          rm -rf release-upload
          mkdir -p release-upload
          cp plugin/.scaffold/build/fire-fly-agent-zotero.xpi release-upload/
          cp plugin/.scaffold/build/update.json release-upload/
          if [ -f plugin/.scaffold/build/update-beta.json ]; then
            cp plugin/.scaffold/build/update-beta.json release-upload/
          fi
          cp backend/FireFly/dist/*.whl release-upload/
          cp backend/FireFly/dist/*.tar.gz release-upload/
          cp release-dist/llm-wiki-template.zip release-upload/
          cp release/install-backend.ps1 release-upload/
          cp release/install-backend.sh release-upload/
          cp release/start-bridge.ps1 release-upload/
          cp release/start-bridge.sh release-upload/
          cp INSTALL.md release-upload/
          echo "=== Release assets ==="
          ls -la release-upload/

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<EOF
          ## FireFly-Agent-Zotero ${{ steps.meta.outputs.tag }}

          > **不要下载**页面顶部的 \`Source code (zip)\`（那是 GitHub 自动附带的仓库快照）。
          > 请在本页下方 **Assets** 中下载 \`.xpi\`、\`.whl\` 等文件。

          ### 插件
          - \`fire-fly-agent-zotero.xpi\` (v${{ steps.meta.outputs.plugin_version }})
          - \`update.json\` — 插件自动更新清单

          ### 后端
          - \`firefly_ai-${{ steps.meta.outputs.backend_version }}-py3-none-any.whl\`
          - \`firefly_ai-${{ steps.meta.outputs.backend_version }}.tar.gz\`（Python 包源码，非整仓）
          - \`llm-wiki-template.zip\`

          ### 安装
          见 \`INSTALL.md\` 或 \`install-backend.ps1\` / \`install-backend.sh\`。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FireFly-Agent-Zotero ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          fail_on_unmatched_files: false
          files: release-upload/*

      - name: Publish plugin update channel (rolling release tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST=plugin/.scaffold/build/update.json
          if [ -f plugin/.scaffold/build/update-beta.json ] && echo "${{ steps.meta.outputs.version }}" | grep -qF '-'; then
            MANIFEST=plugin/.scaffold/build/update-beta.json
          fi
          if gh release view release >/dev/null 2>&1; then
            gh release upload release "$MANIFEST" --clobber
          else
            gh release create release "$MANIFEST" \
              --title "Plugin auto-update channel" \
              --notes "Rolling update manifest for Zotero plugin. Do not delete."
          fi
