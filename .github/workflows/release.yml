name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v3.7.30)"
        required: true
        default: "v3.7.30"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_name=FireFly-Agent-Zotero-${VERSION}-windows.zip" >> "$GITHUB_OUTPUT"
          PLUGIN_VERSION=$(node -p "require('./plugin/package.json').version")
          BACKEND_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("backend/FireFly/pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "backend_version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build backend wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build backend/FireFly
          ls -la backend/FireFly/dist/

      - name: Pack llm-wiki template (CI internal)
        run: bash release/pack-llm-wiki-template.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Build Zotero plugin (XPI)
        working-directory: plugin
        run: |
          npm ci
          npm run build
          test -f .scaffold/build/fire-fly-agent-zotero.xpi

      - name: Build Windows release bundle (single ZIP)
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BUNDLE_NAME="${{ steps.meta.outputs.bundle_name }}"
          ROOT="release-staging/FireFly-Agent-Zotero-${VERSION}"
          mkdir -p "$ROOT/plugin" "$ROOT/backend" "$ROOT/llm-wiki"
          cp plugin/.scaffold/build/fire-fly-agent-zotero.xpi "$ROOT/plugin/"
          cp plugin/.scaffold/build/update.json "$ROOT/plugin/"
          cp backend/FireFly/dist/*.whl "$ROOT/backend/"
          unzip -qo release-dist/llm-wiki-template.zip -d "$ROOT/llm-wiki"
          cp release/install-backend.ps1 "$ROOT/"
          cp release/start-bridge.ps1 "$ROOT/"
          cp release/QUICKSTART.txt "$ROOT/"
          cp INSTALL.md "$ROOT/"
          mkdir -p release-dist
          rm -f "release-dist/${BUNDLE_NAME}"
          (cd release-staging && zip -rq "../release-dist/${BUNDLE_NAME}" "FireFly-Agent-Zotero-${VERSION}")
          ls -la "release-dist/${BUNDLE_NAME}"
          unzip -l "release-dist/${BUNDLE_NAME}" | head -30

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<EOF
          ## FireFly-Agent-Zotero ${{ steps.meta.outputs.tag }}

          > **请下载下方唯一安装包** \`${{ steps.meta.outputs.bundle_name }}\`（一键 ZIP）。
          > **不要**点页面顶部的 \`Source code (zip)\`（那是 GitHub 自动附带的整仓源码）。

          ### 安装包内容（解压后）
          - \`plugin/fire-fly-agent-zotero.xpi\` — Zotero 插件
          - \`backend/firefly_ai-${{ steps.meta.outputs.backend_version }}-py3-none-any.whl\` — 后端
          - \`llm-wiki/\` — 文献目录模板
          - \`install-backend.ps1\` / \`start-bridge.ps1\` — Windows 脚本
          - \`QUICKSTART.txt\` / \`INSTALL.md\`

          ### 快速开始（Windows）
          1. 解压 ZIP
          2. PowerShell 执行 \`.\install-backend.ps1\`
          3. 编辑 \`%USERPROFILE%\\FireFly-Agent-Zotero\\config\\config.json\` 填入 API Key
          4. \`.\start-bridge.ps1\`
          5. Zotero 安装 \`plugin\\fire-fly-agent-zotero.xpi\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FireFly-Agent-Zotero ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: release-dist/${{ steps.meta.outputs.bundle_name }}

      - name: Publish plugin update channel (rolling release tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST=plugin/.scaffold/build/update.json
          if [ -f plugin/.scaffold/build/update-beta.json ] && echo "${{ steps.meta.outputs.version }}" | grep -qF '-'; then
            MANIFEST=plugin/.scaffold/build/update-beta.json
          fi
          if gh release view release >/dev/null 2>&1; then
            gh release upload release "$MANIFEST" --clobber
          else
            gh release create release "$MANIFEST" \
              --title "Plugin auto-update channel" \
              --notes "Rolling update manifest for Zotero plugin. Do not delete."
          fi
