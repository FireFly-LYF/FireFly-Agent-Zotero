<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <label
    id="__addonRef__-pref-desc"
    data-l10n-id="pref-desc"
    style="margin-bottom: 8px"
  ></label>
  <label
    id="__addonRef__-pref-status"
    data-l10n-id="pref-status-loading"
    style="margin-bottom: 8px; color: var(--fill-secondary)"
  ></label>
  <tabbox flex="1" style="min-height: 420px">
    <tabs>
      <tab id="__addonRef__-tab-config" label="config.json" />
      <tab id="__addonRef__-tab-context" label="context.json" />
      <tab id="__addonRef__-tab-user" label="user.json" />
    </tabs>
    <tabpanels flex="1">
      <tabpanel>
        <vbox flex="1">
          <label
            id="__addonRef__-path-config"
            style="font-family: monospace; margin-bottom: 4px"
          ></label>
          <html:textarea
            id="__addonRef__-editor-config"
            flex="1"
            style="font-family: monospace; min-height: 360px; width: 100%; tab-size: 2"
            wrap="off"
          ></html:textarea>
        </vbox>
      </tabpanel>
      <tabpanel>
        <vbox flex="1">
          <label
            id="__addonRef__-path-context"
            style="font-family: monospace; margin-bottom: 4px"
          ></label>
          <html:textarea
            id="__addonRef__-editor-context"
            flex="1"
            style="font-family: monospace; min-height: 360px; width: 100%; tab-size: 2"
            wrap="off"
          ></html:textarea>
        </vbox>
      </tabpanel>
      <tabpanel>
        <vbox flex="1">
          <label
            id="__addonRef__-path-user"
            style="font-family: monospace; margin-bottom: 4px"
          ></label>
          <html:textarea
            id="__addonRef__-editor-user"
            flex="1"
            style="font-family: monospace; min-height: 360px; width: 100%; tab-size: 2"
            wrap="off"
          ></html:textarea>
        </vbox>
      </tabpanel>
    </tabpanels>
  </tabbox>
  <hbox style="margin-top: 8px">
    <button id="__addonRef__-pref-reload"></button>
    <button id="__addonRef__-pref-save"></button>
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
